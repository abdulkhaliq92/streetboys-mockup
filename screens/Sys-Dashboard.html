<script type="text/x-dc-logic" id="dc-logic" data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
renderVals() {
const now=[8,22,46,58,92,100,74,40], prev=[10,18,38,62,80,86,70,44], l=['15','16','17','18','19','20','21','22'];
const hours = l.map((x,i)=>({ l: x+':00', now: now[i]+'%', prev: prev[i]+'%' }));
const top = [['El Classico',38],['Erkin S#%tana',27],['Loaded Fries Chipotle',24],['Old London Smash',19],['Chipohalloumi',14]].map(([n,q])=>({ n:n, q:q, w: Math.round(q/38*100)+'%' }));
return { hours: hours, top: top };
}
}
</script>
